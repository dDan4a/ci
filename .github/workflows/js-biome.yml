name: js-biome

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run in, relative to the repository root
        type: string
        default: .

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    env:
      BIOME_VERSION: 2.6.6
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the reference config if the repo has none
        env:
          REFERENCE_CONFIGS: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/configs
        run: compgen -G 'biome.json*' >/dev/null || curl -fsSLO "$REFERENCE_CONFIGS/biome.json"
      - run: npx --yes "@biomejs/biome@$BIOME_VERSION" ci .
