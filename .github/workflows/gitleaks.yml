name: gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          RELEASE_URL: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "$RELEASE_URL/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
      - run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --verbose --no-banner'
