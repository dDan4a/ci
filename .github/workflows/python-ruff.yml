name: python-ruff

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run in, relative to the repository root
        type: string
        default: .

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    env:
      RUFF_VERSION: 0.17.4
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the reference config if the repo has none
        env:
          REFERENCE_CONFIGS: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/configs
        run: test -e ruff.toml || test -e .ruff.toml || grep -qs '^\[tool\.ruff' pyproject.toml || curl -fsSLO "$REFERENCE_CONFIGS/ruff.toml"
      - run: pipx run --spec "ruff==$RUFF_VERSION" ruff check --output-format github .
      - run: pipx run --spec "ruff==$RUFF_VERSION" ruff format --check --diff .
