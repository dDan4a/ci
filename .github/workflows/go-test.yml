name: go-test

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run in, relative to the repository root
        type: string
        default: .
      go-versions:
        description: JSON list of Go versions for setup-go; an empty string takes the version from go.mod
        type: string
        default: '[""]'
      os:
        description: JSON list of runners
        type: string
        default: '["ubuntu-latest"]'
      tags:
        description: Build tags passed to go test -tags, e.g. integration
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go || 'from go.mod' }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        go: ${{ fromJSON(inputs.go-versions) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      - env:
          TAGS: ${{ inputs.tags }}
        run: go test -race -cover -tags "$TAGS" ./...
