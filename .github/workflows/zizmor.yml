name: zizmor

on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the reference config if the repo has none
        env:
          REFERENCE_CONFIGS: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/configs
        run: test -e .github/zizmor.yml || test -e zizmor.yml || curl -fsSL --create-dirs -o .github/zizmor.yml "$REFERENCE_CONFIGS/zizmor.yml"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec "zizmor==$ZIZMOR_VERSION" zizmor --format github .
